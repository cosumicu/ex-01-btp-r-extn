<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/popup.css" />
    <!-- REMOVED: <link rel="stylesheet" href="css/apexcharts.css" /> -->
    <title>Reddit Post Timing Analyzer</title>
  </head>
  <body>
    <div class="c-0">
      <h3>Best Time to Post on Reddit</h3>
    </div>

    <div class="c-1">
      <div class="hero">
        <div class="controls-row">
          <div class="subreddit-info">
            <p>Subreddit:</p>
            <p id="subreddit">Loading...</p>
          </div>
          <button id="analyzeBtn" type="button">
            <span class="button-spinner" hidden aria-hidden="true"></span>
            <span id="analyzeBtnLabel">Analyze</span>
          </button>
        </div>
      </div>
      <div id="results"></div>
      <!-- Heatmap Container -->
      <div id="heatmap-container" style="display: none">
        <div id="heatmap-chart"></div>
        <div class="heatmap-info">
          <div class="heatmap-legend">
            <span class="legend-label">Low Engagement</span>
            <div class="legend-gradient"></div>
            <span class="legend-label">High Engagement</span>
          </div>
          <div class="stats">
            <p id="bestTimeInfo"></p>
          </div>
        </div>
      </div>
      <section id="evidence-cards" class="evidence-cards" style="display: none" aria-label="Recommendation details">
        <div class="evidence-card">
          <span>Posts at this time</span>
          <strong id="slot-post-count"></strong>
        </div>
        <div class="evidence-card">
          <span>Median score</span>
          <strong id="slot-median-score"></strong>
          <small id="slot-score-note" hidden>Need 3+ posts</small>
        </div>
        <div class="evidence-card">
          <span>Median comments</span>
          <strong id="slot-median-comments"></strong>
          <small id="slot-comments-note" hidden>Need 3+ posts</small>
        </div>
        <div class="evidence-card">
          <span>Alternative time</span>
          <strong id="alternative-time"></strong>
          <small id="alternative-post-count"></small>
        </div>
      </section>
      <div id="comments-chart-container" style="display: none">
        <div id="comments-chart"></div>
      </div>
    </div>

    <!-- CHANGED: Use local file instead of CDN -->
    <script src="js/apexcharts.min.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
